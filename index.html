<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#254e42">
    <meta name="description" content="Osobista lista prezentów i rezerwacji.">
    <meta name="referrer" content="no-referrer">
    <title>Prezentownik · Lista prezentów</title>
    <link rel="icon" href="./assets/gift.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Przejdź do listy prezentów</a>
    <div id="mode-banner" class="mode-banner" hidden></div>
    <main id="main">
      <section class="list-section" aria-labelledby="list-heading"><div class="section-heading"><div class="list-title"><h1 id="list-heading">Lista prezentów</h1></div><nav class="list-actions" aria-label="Opcje listy"><button class="outline-button" id="share-button">Udostępnij</button></nav></div><div id="recipients" class="recipients" aria-label="Wybierz osobę"></div><div class="filter-bar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Znajdź prezent…" aria-label="Szukaj prezentu"></label><label class="select-wrap"><span class="sr-only">Kategoria</span><select id="category"><option value="">Wszystkie kategorie</option></select></label><label class="select-wrap"><span class="sr-only">Sortowanie</span><select id="sort"><option value="priority">Najpierw priorytet</option><option value="price-asc">Cena: rosnąco</option><option value="price-desc">Cena: malejąco</option><option value="name">Nazwa: A–Z</option></select></label></div><div class="results-bar"><p id="result-count" role="status">Wczytywanie listy…</p><div class="status-filters" aria-label="Dostępność"><button data-status="all" class="active" aria-pressed="true">Wszystkie</button><button data-status="available" aria-pressed="false">Dostępne</button><button data-status="mine" aria-pressed="false">Moje rezerwacje</button></div></div><div id="load-error" class="error-panel" hidden></div><div id="gifts" class="gift-grid" aria-live="polite"></div></section>
    </main>
    <dialog id="modal" aria-labelledby="modal-title"><button id="modal-close" class="close-button" aria-label="Zamknij okno">×</button><div id="modal-content"></div></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript>Włącz JavaScript, aby zobaczyć prezenty i dokonać rezerwacji.</noscript>
  </body>
</html>
