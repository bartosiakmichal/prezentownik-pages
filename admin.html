<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#254e42">
    <meta name="description" content="Osobista lista prezentów i rezerwacji.">
    <meta name="referrer" content="no-referrer">
    <title>Panel administratora · Prezentownik</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link rel="icon" href="./assets/gift.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body data-admin="true">
    <a class="skip" href="#main">Przejdź do listy prezentów</a>
    <div id="mode-banner" class="mode-banner" hidden></div>
    <section id="admin-login" class="login-panel" aria-labelledby="login-heading">
      <h1 id="login-heading">Panel administratora</h1>
      <form id="admin-login-form">
        <label class="form-field">Hasło<input name="password" type="password" required autocomplete="current-password" autofocus></label>
        <p id="admin-login-note" class="footer-help" hidden></p>
        <p id="admin-login-error" class="form-error" role="alert" hidden></p>
        <button class="primary-button" id="admin-login-submit" type="submit" disabled>Zaloguj się</button>
      </form>
      <a class="login-back" href="./">Wróć do listy</a>
    </section>
    <main id="main" hidden>
      <section class="list-section" aria-labelledby="list-heading"><div class="section-heading"><div class="list-title"><h1 id="list-heading">Panel administratora</h1><span id="group-label" class="group-label" hidden></span></div><nav class="list-actions" aria-label="Opcje listy"><a class="text-button" href="./">Publiczna lista</a><button class="outline-button" id="share-button">Udostępnij</button><button class="outline-button" id="admin-button">Panel admina</button></nav></div><div id="recipients" class="recipients" aria-label="Wybierz osobę"></div><div id="admin-toolbar" hidden></div><div class="filter-bar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Znajdź prezent…" aria-label="Szukaj prezentu"></label><label class="select-wrap"><span class="sr-only">Kategoria</span><select id="category"><option value="">Wszystkie kategorie</option></select></label><label class="select-wrap"><span class="sr-only">Sortowanie</span><select id="sort"><option value="priority">Najpierw priorytet</option><option value="price-asc">Cena: rosnąco</option><option value="price-desc">Cena: malejąco</option><option value="name">Nazwa: A–Z</option></select></label></div><div class="results-bar"><p id="result-count" role="status">Wczytywanie listy…</p><div class="status-filters" aria-label="Dostępność"><button data-status="all" class="active" aria-pressed="true">Wszystkie</button><button data-status="available" aria-pressed="false">Dostępne</button><button data-status="mine" aria-pressed="false">Moje rezerwacje</button></div></div><div id="load-error" class="error-panel" hidden></div><div id="gifts" class="gift-grid" aria-live="polite"></div></section>
    </main>
    <dialog id="modal" aria-labelledby="modal-title"><button id="modal-close" class="close-button" aria-label="Zamknij okno">×</button><div id="modal-content"></div></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript>Włącz JavaScript, aby zobaczyć prezenty i dokonać rezerwacji.</noscript>
  </body>
</html>
